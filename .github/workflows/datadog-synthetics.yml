# Th- name: Coder Create Task
  # You may pin to the exact commit or the version.
  # uses: coder/create-task-action@a2f4758e6eb3b2c2aefd0fdd4b062e678e1db703
  uses: coder/create-task-action@v0.0.5
  with:
    # Prompt/instructions to send to the task
    coder-task-prompt: 
    # Coder session token for authentication
    coder-token: 
    # Coder deployment URL
    coder-url: 
    # Coder template to use for workspace
    coder-template-name: 
    # GitHub issue URL to link this task to
    github-issue-url: 
    # GitHub token for API operations
    github-token: 
    # GitHub user ID to create task for. If provided, `coder-username` must not be set.
    github-user-id: # optional
    # Coder username to create task for. If provided, github-user-id must not be set. Useful for automated workflows without a triggering user.
    coder-username: # optional
    # Coder organization name
    coder-organization: # optional, default is default
    # Prefix for task name
    coder-task-name-prefix: # optional, default is gh
    # Template preset to use (optional)
    coder-template-preset: # optional
    # Whether to comment on the GitHub issue
    comment-on-issue: # optional, default is trueis workflow will trigger Datadog Synthetic tests within your Datadog organisation
# For more information on running Synthetic tests within your GitHub workflows see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# To get started:

# 1. Add your Datadog API (DD_API_KEY) and Application Key (DD_APP_KEY) as secrets to your GitHub repository. For more information, see: https://docs.datadoghq.com/account_management/api-app-keys/.
# 2. Start using the action within your workflow

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Run Synthetic tests within your GitHub workflow.
    # For additional configuration options visit the action within the marketplace: https://github.com/marketplace/actions/datadog-synthetics-ci
    - name: Run Datadog Synthetic tests
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
      with:
        api_key: ${{secrets.DD_API_KEY}}
        app_key: ${{secrets.DD_APP_KEY}}
        test_search_query: 'tag:e2e-tests' #Modify this tag to suit your tagging strategy


